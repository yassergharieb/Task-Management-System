openapi: 3.0.3
info:
  title: Task Management System API
  version: 1.0.0
  description: REST API for authentication, projects, tasks, attachments, dashboard statistics, and overdue task notifications.
servers:
  - url: http://localhost:8080/api/v1
    description: Docker
  - url: http://localhost:8000/api/v1
    description: Local artisan server
tags:
  - name: Authentication
  - name: Dashboard
  - name: Projects
  - name: Tasks
security:
  - sanctumBearer: []
paths:
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Test User
              email: test@example.com
              password: password
              password_confirmation: password
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /login:
    post:
      tags:
        - Authentication
      summary: Log in and create a Sanctum token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: test@example.com
              password: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /logout:
    post:
      tags:
        - Authentication
      summary: Revoke the current Sanctum token
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get dashboard statistics for the authenticated user
      responses:
        '200':
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Dashboard statistics retrieved successfully
                  data:
                    $ref: '#/components/schemas/DashboardStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects:
    get:
      tags:
        - Projects
      summary: List authenticated user's projects
      parameters:
        - $ref: '#/components/parameters/ProjectStatusFilter'
        - $ref: '#/components/parameters/SearchFilter'
        - $ref: '#/components/parameters/PerPageFilter'
      responses:
        '200':
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Projects retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Projects
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProjectRequest'
            example:
              name: Project Alpha
              description: First project in the workspace.
              status: active
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreProjectMultipartRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{project}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Projects
      summary: View a project
      responses:
        '200':
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Projects
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
            example:
              name: Project Alpha Updated
              description: Updated project details.
              status: completed
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProjectMultipartRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Projects
      summary: Soft delete a project
      description: Soft deletes the project and its tasks, then dispatches attachment cleanup for the project and its tasks.
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Project deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Tasks
      summary: List tasks for a project
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskPriorityFilter'
        - $ref: '#/components/parameters/SearchFilter'
        - $ref: '#/components/parameters/PerPageFilter'
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - data
                properties:
                  message:
                    type: string
                    example: Tasks retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Tasks
      summary: Create a task in a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreTaskRequest'
            example:
              title: Prepare launch checklist
              description: Write rollout tasks.
              priority: high
              status: todo
              due_date: '2026-08-15'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreTaskMultipartRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags:
        - Tasks
      summary: View a task
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Tasks
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            example:
              title: Prepare launch checklist updated
              description: Updated rollout tasks.
              priority: medium
              status: in_progress
              due_date: '2026-08-20'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateTaskMultipartRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Tasks
      summary: Soft delete a task
      description: Soft deletes the task and dispatches attachment cleanup for that task.
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Task deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    ProjectId:
      name: project
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    TaskId:
      name: task
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    ProjectStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProjectStatus'
    TaskStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskStatus'
    TaskPriorityFilter:
      name: priority
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskPriority'
    SearchFilter:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
      example: release
    PerPageFilter:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
      example: 15
  responses:
    Unauthorized:
      description: Unauthenticated or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                message: Unauthenticated.
            invalidCredentials:
              value:
                message: Invalid credentials.
    NotFound:
      description: Resource not found or not owned by the authenticated user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Resource not found.
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            message: The name field is required.
            errors:
              name:
                - The name field is required.
  schemas:
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ValidationErrorResponse:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    AuthResponse:
      type: object
      required:
        - message
        - token
        - data
      properties:
        message:
          type: string
          example: Login successful
        token:
          type: string
          example: 1|plain-text-sanctum-token
        data:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
        - id
        - name
        - email
        - created_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: test@example.com
        created_at:
          type: string
          format: date-time
    ProjectStatus:
      type: string
      enum:
        - active
        - completed
        - archived
    TaskStatus:
      type: string
      enum:
        - todo
        - in_progress
        - done
    TaskPriority:
      type: string
      enum:
        - low
        - medium
        - high
    Attachment:
      type: object
      required:
        - id
        - name
        - path
        - disk
        - size
        - url
        - created_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: brief.pdf
        path:
          type: string
          example: projects/1/brief.pdf
        disk:
          type: string
          example: public
        mime_type:
          type: string
          nullable: true
          example: application/pdf
        size:
          type: integer
          example: 2048
        url:
          type: string
          example: /storage/projects/1/brief.pdf
        created_at:
          type: string
          format: date-time
    Project:
      type: object
      required:
        - id
        - name
        - status
        - attachments
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Project Alpha
        description:
          type: string
          nullable: true
          example: First project in the workspace.
        status:
          $ref: '#/components/schemas/ProjectStatus'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Task:
      type: object
      required:
        - id
        - project_id
        - title
        - priority
        - status
        - attachments
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        project_id:
          type: integer
          example: 1
        title:
          type: string
          example: Prepare launch checklist
        description:
          type: string
          nullable: true
          example: Write rollout tasks.
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'
        due_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-15'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DashboardStatistics:
      type: object
      required:
        - total_projects
        - active_projects
        - total_tasks
        - completed_tasks
        - pending_tasks
        - overdue_tasks
      properties:
        total_projects:
          type: integer
          example: 2
        active_projects:
          type: integer
          example: 1
        total_tasks:
          type: integer
          example: 3
        completed_tasks:
          type: integer
          example: 1
        pending_tasks:
          type: integer
          example: 2
        overdue_tasks:
          type: integer
          example: 1
    ProjectResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Project retrieved successfully
        data:
          $ref: '#/components/schemas/Project'
    TaskResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Task retrieved successfully
        data:
          $ref: '#/components/schemas/Task'
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    StoreProjectRequest:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ProjectStatus'
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ProjectStatus'
    StoreProjectMultipartRequest:
      allOf:
        - $ref: '#/components/schemas/StoreProjectRequest'
        - type: object
          properties:
            attachments:
              type: array
              items:
                type: string
                format: binary
              description: Allowed extensions are pdf, doc, txt, and md. Maximum size is 10 MB per file.
    UpdateProjectMultipartRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateProjectRequest'
        - type: object
          properties:
            attachments:
              type: array
              items:
                type: string
                format: binary
              description: Allowed extensions are pdf, doc, txt, and md. Maximum size is 10 MB per file.
    StoreTaskRequest:
      type: object
      required:
        - title
        - priority
        - status
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'
        due_date:
          type: string
          format: date
          nullable: true
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'
        due_date:
          type: string
          format: date
          nullable: true
    StoreTaskMultipartRequest:
      allOf:
        - $ref: '#/components/schemas/StoreTaskRequest'
        - type: object
          properties:
            attachments:
              type: array
              items:
                type: string
                format: binary
              description: Allowed extensions are pdf, doc, txt, and md. Maximum size is 10 MB per file.
    UpdateTaskMultipartRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateTaskRequest'
        - type: object
          properties:
            attachments:
              type: array
              items:
                type: string
                format: binary
              description: Allowed extensions are pdf, doc, txt, and md. Maximum size is 10 MB per file.
